<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>MELON SODA BURST - SODA DRIVE REMIX</title>
<style>
:root{--cream:#f7efc1;--mint:#b8ffbc;--cherry:#f24d6b;--lemon:#ffe169;--ink:#07120a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{background:#08110a;color:var(--cream);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
#stage{position:relative;height:100%;overflow:hidden;box-shadow:0 0 0 3px #0c2314,0 0 0 6px #b8ffbc,0 0 0 9px #0c2314}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.04) 0 2px,transparent 2px 6px);z-index:6}
#cv{display:block;touch-action:none;image-rendering:pixelated}
.pix canvas,.titleArt{display:block;image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%}
.pix{display:inline-flex;align-items:center;justify-content:center;max-width:100%;vertical-align:middle}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;padding:14px 12px;text-align:center;background:rgba(4,15,9,.84);z-index:2}
.ov[hidden],[hidden]{display:none!important}
.titleArt{width:min(340px,92%);height:auto;filter:drop-shadow(0 6px 0 #061009)}
.lineup{display:block;width:min(340px,92%);height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
#title{cursor:pointer;gap:18px}
.tapbtn{background:none;border:0;padding:8px;cursor:pointer}
.subbtn{min-height:40px;padding:6px 14px;background:#f7efc1;border:3px solid #07120a;box-shadow:3px 3px 0 #07120a;cursor:pointer}
.subbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #07120a}
.best-row{display:flex;flex-direction:column;align-items:center;gap:8px}
#records{background:#04100a;z-index:3}
.over-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn,.game-button,.card{border-radius:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn{min-height:54px;background:var(--lemon);color:var(--ink);border:4px solid #07120a;box-shadow:5px 5px 0 #bb8a23;padding:12px 20px;animation:bob .95s steps(2,end) infinite}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #bb8a23}
.btn:focus-visible,.game-button:focus-visible,.card:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.best{min-height:14px;color:#b8ffbc}
.blinkline{animation:blink 1s steps(2,end) infinite}
.pick-title,.reward-prompt,.result{display:flex;justify-content:center;align-items:center;max-width:100%}
.cards{display:flex;flex-direction:column;gap:13px;width:min(340px,100%)}
.card{display:flex;align-items:center;gap:12px;text-align:left;background:#efe3a7;border:4px solid #07120a;min-height:76px;padding:10px;box-shadow:5px 5px 0 rgba(0,0,0,.6);width:100%;color:#07120a}
.card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 rgba(0,0,0,.6)}
.card .sprite-icon{width:46px;height:46px;flex:none;image-rendering:pixelated;border:3px solid #07120a;background:#113021}
.card-text{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:9px;min-width:0}
.card .desc{opacity:.85}
.result{min-height:46px}
.newbest{padding:8px;background:#ffe169;border:3px solid #07120a}
.stats{display:grid;grid-template-columns:auto auto;column-gap:22px;row-gap:10px;justify-items:start;align-items:center;text-align:left;padding:14px;background:#0b2d1b;border:3px solid #477b53}
.stats>div:nth-child(2n){justify-self:end}
.game-button{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:4;padding:8px 8px;min-height:40px;background:#f7efc1;border:3px solid #07120a;box-shadow:3px 3px 0 #07120a;display:flex;justify-content:center;align-items:center}
.snd{left:8px;width:99px}.pauseBtn{left:113px;width:108px}
.burstBtn{right:7px;width:145px;height:46px;background:#efe3a7}
.burstBtn:disabled{opacity:.86;cursor:default}
.burstBtn.ready{background:#ffe169;animation:readyPulse .5s steps(2,end) infinite;box-shadow:0 0 0 3px #fff9b5,3px 3px 0 #07120a}
#settings{background:#04100a;z-index:3}
#ending{background:#04100a;z-index:3;gap:14px}
.rollbox{height:150px;width:min(320px,100%);overflow:hidden;position:relative;border-top:2px solid #477b53;border-bottom:2px solid #477b53}
.roll{position:absolute;left:0;right:0;top:100%;display:flex;flex-direction:column;align-items:center;gap:14px;animation:roll 14s linear forwards}
@keyframes roll{to{transform:translateY(calc(-100% - 67px))}}
.end-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
@media(prefers-reduced-motion:reduce){.roll{animation:none;top:0}}
.opts{display:flex;flex-direction:column;gap:12px;width:min(340px,100%);padding:14px 12px;background:#0b2d1b;border:3px solid #477b53}
.opt-row{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:8px}
.opt-row>.pix{justify-content:flex-start}
.opt-val{min-width:76px;display:flex;justify-content:center}
.optbtn{width:40px;height:40px;background:#efe3a7;border:3px solid #07120a;box-shadow:3px 3px 0 #07120a;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;border-radius:0;padding:0}
.optbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #07120a}
.optbtn:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
.rank{display:flex;justify-content:center;animation:rankPop .35s steps(4,end)}
@keyframes rankPop{0%{transform:translateY(-18px);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-4px)}}@keyframes blink{50%{opacity:.3}}@keyframes readyPulse{50%{background:#ff8c42}}
@media (max-width:359px){.snd{width:78px}.pauseBtn{left:88px;width:90px}.burstBtn{width:128px}.ov{gap:12px}.stats{row-gap:8px}}
@media(prefers-reduced-motion:reduce){.btn,.blinkline,.burstBtn.ready{animation:none}}
</style>

<div id="wrap">
  <div id="stage">
    <canvas id="cv" aria-label="Melon Soda Burst arcade shooter"></canvas>
    <button class="pauseBtn game-button" id="pauseBtn" type="button" hidden aria-label="Pause the game"><span class="pix" data-pixel="II PAUSE" data-size="2" data-color="#07120a"></span></button>
    <button class="burstBtn game-button" id="burstBtn" type="button" hidden disabled aria-label="Soda burst charge"><span class="pix" data-pixel="BURST 0%" data-size="2"></span></button>
    <button class="snd game-button" id="bgmBtn" type="button" aria-label="Open options"><span class="pix" data-pixel="OPTION" data-size="2" data-color="#07120a"></span></button>
    <div class="ov" id="title">
      <canvas class="titleArt" id="titleArt" width="320" height="120" aria-label="Melon Soda Burst"></canvas>
      <canvas class="lineup" id="lineup" width="320" height="170" aria-label="Bosses"></canvas>
      <button class="tapbtn blinkline" id="startBtn" type="button" aria-label="Start game"><span class="pix" data-pixel="TAP TO START" data-size="3" data-color="#ffe169"></span></button>
      <div class="best-row"><div class="best" id="titleBest"></div><div class="best" id="titleRank"></div></div>
      <button class="subbtn" id="recordsBtn" type="button" aria-label="Show records"><span class="pix" data-pixel="RECORDS" data-size="2" data-color="#07120a"></span></button>
    </div>
    <div class="ov" id="pick" hidden>
      <div class="pick-title" id="pickTitle"><span class="pix" data-pixel="WAVE CLEAR" data-size="3" data-color="#ffe169"></span></div>
      <div class="reward-prompt"><span class="pix" data-pixel="SELECT ONE UPGRADE" data-size="2"></span></div>
      <div class="cards" id="cards"></div>
    </div>
    <div class="ov" id="paused" hidden>
      <div class="pick-title"><span class="pix" data-pixel="PAUSED" data-size="4" data-color="#ffe169"></span></div>
      <div><span class="pix" data-pixel="TAKE A BREAK" data-size="2"></span></div>
      <button class="btn" id="resumeBtn" type="button" aria-label="Resume game"><span class="pix" data-pixel="RESUME" data-size="3" data-color="#07120a"></span></button>
    </div>
    <div class="ov" id="ending" hidden>
      <div class="pick-title" id="endTitle"></div>
      <div class="rollbox"><div class="roll" id="roll"></div></div>
      <div class="stats" id="endStats"></div>
      <div class="rank" id="endRank"></div>
      <div class="end-btns">
        <button class="btn" id="endlessBtn" type="button" aria-label="Continue in endless mode"><span class="pix" data-pixel="ENDLESS" data-size="3" data-color="#07120a"></span></button>
        <button class="btn" id="titleBtn" type="button" aria-label="Back to title"><span class="pix" data-pixel="TITLE" data-size="3" data-color="#07120a"></span></button>
      </div>
    </div>
    <div class="ov" id="records" hidden>
      <div class="pick-title"><span class="pix" data-pixel="RECORDS" data-size="4" data-color="#ffe169"></span></div>
      <canvas class="lineup" id="recLineup" width="320" height="170" aria-label="Defeated bosses"></canvas>
      <div class="stats" id="recStats"></div>
      <button class="btn" id="recClose" type="button" aria-label="Close records"><span class="pix" data-pixel="BACK" data-size="3" data-color="#07120a"></span></button>
    </div>
    <div class="ov" id="settings" hidden>
      <div class="pick-title"><span class="pix" data-pixel="OPTIONS" data-size="4" data-color="#ffe169"></span></div>
      <div class="opts" id="opts"></div>
      <button class="btn" id="optClose" type="button" aria-label="Close options"><span class="pix" data-pixel="BACK" data-size="3" data-color="#07120a"></span></button>
    </div>
    <div class="ov" id="over" hidden>
      <div class="pick-title"><span class="pix" data-pixel="GAME OVER" data-size="3" data-color="#f24d6b"></span></div>
      <div class="result" id="rScore"></div>
      <div class="rank" id="rRank" hidden></div>
      <div class="newbest" id="rNew" hidden><span class="pix" data-pixel="NEW HIGH SCORE!" data-size="2" data-color="#07120a"></span></div>
      <div class="stats">
        <div><span class="pix" data-pixel="WAVE" data-size="2"></span></div><div id="rWave"></div>
        <div><span class="pix" data-pixel="MAX COMBO" data-size="2"></span></div><div id="rCombo"></div>
        <div><span class="pix" data-pixel="JUST HITS" data-size="2"></span></div><div id="rJust"></div>
        <div><span class="pix" data-pixel="GRAZES" data-size="2"></span></div><div id="rGraze"></div>
      </div>
      <div class="over-btns">
        <button class="btn" id="retryBtn" type="button" aria-label="Play again"><span class="pix" data-pixel="RETRY" data-size="3" data-color="#07120a"></span></button>
        <button class="btn" id="overTitleBtn" type="button" aria-label="Back to title"><span class="pix" data-pixel="TITLE" data-size="3" data-color="#07120a"></span></button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const stage = document.getElementById('stage'), wrap = document.getElementById('wrap');
  const $ = id => document.getElementById(id);
  const FD='monospace', FB='monospace'; // Font names are ignored by the built-in pixel text renderer.
  // Fixed 5x7 bitmap characters. No CSS/system fonts, no image assets or HTTP requests.
  const GLYPH = {"A":["01110","10001","10001","11111","10001","10001","10001"],"B":["11110","10001","10001","11110","10001","10001","11110"],"C":["01111","10000","10000","10000","10000","10000","01111"],"D":["11110","10001","10001","10001","10001","10001","11110"],"E":["11111","10000","10000","11110","10000","10000","11111"],"F":["11111","10000","10000","11110","10000","10000","10000"],"G":["01111","10000","10000","10111","10001","10001","01111"],"H":["10001","10001","10001","11111","10001","10001","10001"],"I":["11111","00100","00100","00100","00100","00100","11111"],"J":["00111","00010","00010","00010","10010","10010","01100"],"K":["10001","10010","10100","11000","10100","10010","10001"],"L":["10000","10000","10000","10000","10000","10000","11111"],"M":["10001","11011","10101","10101","10001","10001","10001"],"N":["10001","11001","10101","10011","10001","10001","10001"],"O":["01110","10001","10001","10001","10001","10001","01110"],"P":["11110","10001","10001","11110","10000","10000","10000"],"Q":["01110","10001","10001","10001","10101","10010","01101"],"R":["11110","10001","10001","11110","10100","10010","10001"],"S":["01111","10000","10000","01110","00001","00001","11110"],"T":["11111","00100","00100","00100","00100","00100","00100"],"U":["10001","10001","10001","10001","10001","10001","01110"],"V":["10001","10001","10001","10001","10001","01010","00100"],"W":["10001","10001","10001","10101","10101","10101","01010"],"X":["10001","10001","01010","00100","01010","10001","10001"],"Y":["10001","10001","01010","00100","00100","00100","00100"],"Z":["11111","00001","00010","00100","01000","10000","11111"],"0":["01110","10001","10011","10101","11001","10001","01110"],"1":["00100","01100","00100","00100","00100","00100","01110"],"2":["01110","10001","00001","00010","00100","01000","11111"],"3":["11110","00001","00001","01110","00001","00001","11110"],"4":["00010","00110","01010","10010","11111","00010","00010"],"5":["11111","10000","10000","11110","00001","00001","11110"],"6":["01110","10000","10000","11110","10001","10001","01110"],"7":["11111","00001","00010","00100","01000","01000","01000"],"8":["01110","10001","10001","01110","10001","10001","01110"],"9":["01110","10001","10001","01111","00001","00001","01110"],"!":["00100","00100","00100","00100","00100","00000","00100"],"?":["01110","10001","00001","00010","00100","00000","00100"],":":["00000","00100","00100","00000","00100","00100","00000"],".":["00000","00000","00000","00000","00000","00100","00100"],",":["00000","00000","00000","00000","00100","00100","01000"],"-":["00000","00000","00000","11111","00000","00000","00000"],"+":["00000","00100","00100","11111","00100","00100","00000"],"/":["00001","00001","00010","00100","01000","10000","10000"],"%":["11001","11010","00100","01000","10110","00110","00000"],"=":["00000","11111","00000","11111","00000","00000","00000"],"'":["00100","00100","00000","00000","00000","00000","00000"]," ":["00000","00000","00000","00000","00000","00000","00000"]};
  function pixText(g, text, x, y, u=2, color='#f7efc1', align='left', shade=null) {
    const str=String(text).toUpperCase();
    const total=Math.max(0,str.length*6-1)*u;
    const start = x-(align==='center'?total/2:align==='right'?total:0);
    if(shade) pixText(g,str,x+u,y+u,u,shade,align,null);
    g.fillStyle=color;
    for(let i=0;i<str.length;i++) {
      const glyph=GLYPH[str[i]]||GLYPH['?'];
      for(let row=0;row<7;row++) for(let col=0;col<5;col++)
        if(glyph[row][col]==='1') g.fillRect(Math.round(start+(i*6+col)*u),Math.round(y+row*u),u,u);
    }
    return total;
  }
  function createPixCanvas(text, zoom=2, color='#f7efc1') {
    const str=String(text).toUpperCase();
    const c=document.createElement('canvas');
    c.width=Math.max(1,str.length*6-1); c.height=7;
    c.style.width=(c.width*zoom)+'px'; c.style.height=(7*zoom)+'px';
    c.style.maxWidth='100%'; c.style.imageRendering='pixelated';
    c.setAttribute('aria-hidden','true');
    pixText(c.getContext('2d'),str,0,0,1,color);
    return c;
  }
  function setPixel(el,text,zoom=2,color='#f7efc1') {
    if(!el)return;
    el.setAttribute('aria-label',String(text));
    el.replaceChildren(createPixCanvas(text,zoom,color));
  }
  function paintPixelUI() {
    document.querySelectorAll('[data-pixel]').forEach(el=>{
      const z=Number(el.dataset.size||2);
      setPixel(el,el.dataset.pixel,z,el.dataset.color||'#f7efc1');
    });
  }
  function setGameCanvasBitmapFont(g) {
    const draw=(text,x,y,maxWidth,outline=false)=>{
      const n=(/([0-9.]+)px/.exec(g.font)||[])[1];
      const size=Number(n)||16;
      const u=Math.max(2,2*Math.round((size/7)/2));
      const str=String(text).toUpperCase();
      const textWidth=Math.max(0,str.length*6-1)*u;
      const allowed = size>=28?376:(maxWidth||1e9);
      const ratio=Math.min(1,allowed/Math.max(1,textWidth));
      let yy=y;
      if(g.textBaseline==='middle') yy-=7*u/2;
      else if(g.textBaseline==='alphabetic') yy-=7*u;
      const color=outline?g.strokeStyle:g.fillStyle;
      g.save();g.translate(Math.round(x),Math.round(yy));g.scale(ratio,1);
      pixText(g,str,0,0,u,color,g.textAlign||'left');
      if(outline) {const old=g.globalAlpha;g.globalAlpha*=0.7;
        pixText(g,str,2,0,u,color,g.textAlign||'left');
        pixText(g,str,-2,0,u,color,g.textAlign||'left');
        pixText(g,str,0,2,u,color,g.textAlign||'left');
        pixText(g,str,0,-2,u,color,g.textAlign||'left');
        g.globalAlpha=old;
      }
      g.restore();
    };
    g.fillText=(text,x,y,maxWidth)=>draw(text,x,y,maxWidth,false);
    g.strokeText=(text,x,y,maxWidth)=>draw(text,x,y,maxWidth,true);
  }
  setGameCanvasBitmapFont(ctx);
  paintPixelUI();

  let W = 400;
  let H = 720, GROUND = 664, scale = 1, dpr = 1;
  const RAD = [11, 17, 25, 35, 47, 70];
  const HGT = [0.26, 0.36, 0.46, 0.54, 0.62, 0.5];
  const COL = ['#ff3b5c', '#ff9a1f', '#ffd93b', '#9b5cff', '#3bb7ff', '#d2143a'];
  const GR = 0.17;

  let mode = 'title'; // title / play / pick / pause / over
  let S;
  let best = 0;
  // 設定（BGM・効果音の音量は0〜10、7が標準。揺れは 0=OFF 1=LOW 2=FULL）
  const SET = { bgm: 7, sfx: 7, vib: true, shake: 2 };
  try {
    Object.assign(SET, JSON.parse(localStorage.getItem('msb-settings') || '{}'));
    if (localStorage.getItem('msb-bgm') === 'off' && !localStorage.getItem('msb-settings')) SET.bgm = 0;
  } catch (e) {}
  // 記録（倒したボス、全クリ回数、最短クリアタイムなど）
  const REC = { bosses: {}, clears: 0, bestTime: 0, bestWave: 0, maxCombo: 0, bestClearRank: '' };
  try { Object.assign(REC, JSON.parse(localStorage.getItem('msb-records') || '{}')); } catch (e) {}
  const saveRec = () => { try { localStorage.setItem('msb-records', JSON.stringify(REC)); } catch (e) {} };
  const RANK_ORDER = ['C', 'B', 'A', 'S', 'SS'];
  const saveSet = () => { try { localStorage.setItem('msb-settings', JSON.stringify(SET)); } catch (e) {} };
  try { best = +localStorage.getItem('msb-best') || 0; } catch (e) {}

  function fresh() {
    return {
      score: 0, wave: 0, lives: 3, combo: 0, comboT: 0, maxCombo: 0, comboPop: 0,
      rush: 0, justs: 0, grazes: 0, burstCount: 0, burstFx: null,
      fever: 0, feverG: 0, feverLen: 360,
      up: { rate: 5, shots: 1, dmg: 1, pierce: 0 }, power: { spread: 0, rapid: 0, beam: 0 }, freezeT: 0, beamTop: 0, blocks: [],
      px: W / 2, tx: W / 2, tilt: 0, lastPx: W / 2, recoil: 0, fireT: 0, inv: 0,
      lastJustStop: -99, seeds: [], drips: [], puddles: [], hits: 0, playT: 0, fw: 0, bubbles: [], bullets: [], parts: [], texts: [], drops: [], queue: [], qT: 0,
      shake: 0, freeze: 0, slow: 0, flash: 0, flashCol: '255,255,255', clearT: 0, banner: null
    };
  }
  S = fresh();
  const fizz = Array.from({ length: 46 }, () => ({ x: Math.random() * W, y: Math.random() * 900, r: 1 + Math.random() * 3, v: 0.3 + Math.random() * 0.9 }));

  // 耐久は4面まで毎回28%増、5面からは毎回12%増にゆるめる（強化1枚ぶんで追いつける伸び）
  const hpGrowth = w => w <= 4 ? Math.pow(1.28, w - 1) : Math.pow(1.28, 3) * Math.pow(1.12, w - 4);
  const hpFor = t => Math.ceil((t + 1) * 1.6 * hpGrowth(S.wave));
  const bounceV = t => Math.sqrt(2 * GR * (GROUND - 90) * HGT[t]);

  function mkBubble(t, x, y, dir, vy = 0) {
    const hp = hpFor(t);
    return { t, x, y, vx: dir * (1.08 + Math.random() * 0.34) * Math.min(1.27, 1 + S.wave * 0.03), vy, hp, max: hp, flash: 0, sq: 0, wob: Math.random() * 6, justCd: 0, grazeCd: 0 };
  }
  // ---- ブロック：氷（撃つと割れる）と金属（壊れない） ----
  // [種類, 横位置(画面幅の割合), 縦位置(画面高さの割合), 幅]
  const LAYOUTS = [
    [['ice', .25, .44, 72], ['ice', .75, .44, 72]],
    [['ice', .2, .5, 64], ['ice', .5, .38, 64], ['ice', .8, .5, 64]],
    [['metal', .5, .5, 96], ['ice', .2, .36, 64], ['ice', .8, .36, 64]],
    [['metal', .28, .42, 64], ['metal', .72, .42, 64], ['ice', .5, .58, 80]],
    [['ice', .22, .6, 64], ['ice', .45, .47, 64], ['ice', .68, .34, 64], ['metal', .85, .58, 48]]
  ];
  function buildBlocks() {
    S.blocks = [];
    if (S.wave < 2 || S.wave % 4 === 0 || (S.wave === 17 && !S.allClear)) return;
    const L = S.wave <= 4 ? LAYOUTS[S.wave - 2] : LAYOUTS[Math.random() * LAYOUTS.length | 0];

  const OPTS = [

      if(M){
        for(let a=0;a<Math.PI*2;a+=0.07){
          if(!rindCovers(a-M.rot))continue;
          pxRect(g,snap(Math.cos(a)*86)-4,snap(Math.sin(a)*86)-4,8,8,'#2d6b1f');
          pxRect(g,snap(Math.cos(a)*95)-2,snap(Math.sin(a)*95)-2,4,4,'#8fd46a');
        }
        if(M.charge>0&&M.charge%8<4)pxRect(g,-4,-r-36,8,16,'#ffe169'),pxRect(g,-4,-r-16,8,6,'#ffe169');
      }
      g.restore();return;
    }
    if(b.bossType==='grape'){
      const sp=spriteBank.grapeCore[b.attached?0:1];g.drawImage(sp,-sp.width/2,-84);
      if(b.flash>.05){const f=spriteBank.flash[4];g.globalAlpha=b.flash*.6;g.drawImage(f,-f.width/2,-f.height/2);g.globalAlpha=1}
      if(b.attached){
        const n=28,rr=r+8,c=frameNo%10<5?'#c9a6ff':'#8f4fe8';
        for(let i=0;i<n;i+=2){const a=i/n*Math.PI*2+frameNo*0.02;pxRect(g,snap(Math.cos(a)*rr)-2,snap(Math.sin(a)*rr)-2,4,4,c);}
      }
      g.restore();return;
    }
    if(b.boss){
      const mood=b.flash>.6?2:b.hp/b.max<.4?1:0;
      g.drawImage(spriteBank.boss[mood],-80,-90);
      g.restore();return;
    }
    const s=(b.kind==='fizz'?spriteBank.fizz:b.kind==='grape'?spriteBank.grape:spriteBank.bubble)[b.t];g.drawImage(s,-s.width/2,-s.height/2);
    if(b.flash>.05){const f=spriteBank.flash[b.t];g.globalAlpha=b.flash*.7;g.drawImage(f,-f.width/2,-f.height/2);g.globalAlpha=1}
    if(b.kind==='chain'){
      const blink=Math.floor(performance.now()/150)%2;
      pxRect(g,-2,-r+2,4,r*2-4,'#07120a');pxRect(g,-r+2,-2,r*2-4,4,'#07120a');
      pxRect(g,-2,-r-6,4,6,'#583017');pxRect(g,-4,-r-12,8,6,blink?'#ffe169':'#ff8c42');
    }
    const hp=Math.max(0,Math.ceil(b.hp));
    g.textAlign='center';g.textBaseline='middle';g.font=Math.max(10,Math.round(r*.55))+'px monospace';
    g.strokeStyle='#102319';g.strokeText(hp,0,3);g.fillStyle='#fff7d5';g.fillText(hp,0,3);
    g.restore();
  }
  function drawPlayer(){
    if(S.inv&&Math.floor(S.inv/5)%2)return;
    const g=ctx;
    const sprite=spriteBank.player[S.fever?2:S.recoil>.75?1:0];
    g.drawImage(sprite,snap(S.px)-24,snap(GROUND)-58);
    if(Math.abs(S.tilt)>0.06&&mode==='play'&&!S.power.beam){
      for(let k=1;k<=3;k++){const d=8+k*14;pxRect(g,snap(S.px+Math.sin(S.tilt)*d)-2,snap(GROUND-64-Math.cos(S.tilt)*d)-2,4,4,k===1?'#ffe169':k===2?'#c9b257':'#7f7a3c');}
    }
  }
  function drawHud() {
    const g = ctx;
    g.textBaseline = 'alphabetic';
    pxRect(g, 8, 8, 160, 50, '#07120a');
    pxRect(g, 10, 10, 156, 46, '#10301f');
    g.textAlign = 'left'; g.font = '20px ' + FD; g.fillStyle = '#fff6df';
    const sc = S.score.toLocaleString();
    g.fillText(sc, 16, 33);
    g.font='12px monospace';g.fillStyle='#d9f7ba';g.fillText('HI '+Math.max(best,S.score).toLocaleString(),16,52);
    pxRect(g, Math.round(W/2) - 58, 10, 116, 22, '#07120a');
    g.textAlign = 'center'; g.font = '12px ' + FD; g.fillStyle = '#ffe169'; g.fillText('WAVE ' + S.wave, W / 2, 26);
    for (let i = 0; i < S.lives; i++) pxHeart(g, W - 22 - i * 24 - 14, 14, 3, '#f24d6b');
    pxRect(g, 12, 66, W - 24, 12, '#07120a');
    pxRect(g, 14, 68, (W - 28) * Math.min(1, S.feverG / 100), 8, S.fever ? '#ff8c42' : '#ffe169');
    g.font = '10px ' + FD;
    // 文字の後ろに不透明の下地を敷く（1文字 = 12論理ピクセル幅）
    const tag = (text, x, y, col, align) => {
      const w = text.length * 12 + 4, x0 = align === 'right' ? x - w + 2 : x - 2;
      pxRect(g, x0, y - 15, w, 16, '#07120a');
      g.textAlign = align; g.fillStyle = col; g.fillText(text, x, y);
    };
    tag(S.fever ? 'FEVER!' : 'FEVER', 14, 93, '#fff6df', 'left');
    let px = W - 14;
    for (const [left, label, col] of [[S.power.rapid, 'RAPID', '#ffb84f'], [S.power.spread, 'WIDE', '#84d1ff'], [S.power.beam, 'BEAM', '#ffe169'], [S.freezeT, 'FREEZE', '#9de8ff']]) {
      if (!left) continue;
      const t = label + ' ' + Math.ceil(left / 60); tag(t, px, 93, col, 'right'); px -= t.length * 12 + 12;
    }
    tag('BURST ' + Math.floor(S.rush) + '%', 14, S.boss ? 132 : 112, '#d9f7ba', 'left');

    if (S.combo >= 3) {
      g.save(); g.translate(Math.round(W / 2), (S.boss ? 164 : 144) - Math.round(S.comboPop * 8));
      g.textAlign = 'center'; g.font = '34px ' + FD;
      g.fillStyle = '#07120a'; g.fillText(S.combo, 3, 3);
      g.fillStyle = S.fever ? '#ff8c42' : '#ffe169'; g.fillText(S.combo, 0, 0);
      g.font = '11px ' + FD; g.fillStyle = '#fff6df'; g.fillText('COMBO', 0, 20);
      g.restore();
      pxRect(g, W / 2 - 40, S.boss ? 194 : 174, 80 * S.comboT / 110, 4, '#ffe169');
    }
    if (S.boss) {
      const f = bossFrac();
      pxRect(g, 12, 94, W - 24, 18, '#07120a');
      pxRect(g, 14, 96, (W - 28) * f, 14, '#f24d6b');
      g.font = '10px ' + FD; g.textAlign = 'left'; g.fillStyle = '#fff6df';
      g.fillText(S.boss.name || 'KING CHERRY', 18, 108);
    }
  }
  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
    const shk = S.shake * [0, 0.45, 1][SET.shake];
    const sx = Math.round((Math.random() - 0.5) * shk), sy = Math.round((Math.random() - 0.5) * shk);
    ctx.save(); ctx.translate(sx, sy);
    bg();
    drawBlocks();
    for (const p of S.parts) if (p.k === 'ring') {
      ctx.globalAlpha = 1 - p.t / p.life;
      const n = Math.max(12, Math.round(p.r * 1.6)), sz = p.t < p.life / 2 ? 4 : 2;
      for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2;
        pxRect(ctx, snap(p.x + Math.cos(a) * p.r), snap(p.y + Math.sin(a) * p.r), sz, sz, p.col);
      }
    }
    ctx.globalAlpha = 1;
    if (S.burstFx) {
      const wave = S.burstFx;
      ctx.save(); ctx.globalAlpha = Math.max(0.05, 0.85 - wave.t * 0.028);
      for (let ang = 0; ang < Math.PI * 2; ang += Math.PI / 20) {
        pxRect(ctx, snap(wave.x + Math.cos(ang) * wave.r), snap(wave.y + Math.sin(ang) * wave.r), 4, 4, '#ffe169');
        pxRect(ctx, snap(wave.x + Math.cos(ang) * Math.max(0,wave.r - 12)), snap(wave.y + Math.sin(ang) * Math.max(0,wave.r - 12)), 4, 4, '#fff6df');
      }
      ctx.restore();
    }
    for (const pu of S.puddles || []) {
      ctx.globalAlpha = Math.min(1, pu.life / 60);
      pxRect(ctx, snap(pu.x - pu.w / 2), GROUND - 4, pu.w, 6, '#fff3d6'); pxRect(ctx, snap(pu.x - pu.w / 2) + 8, GROUND - 8, pu.w - 16, 4, '#efd9a8');
      ctx.globalAlpha = 1;
    }
    if (S.titan && S.titan.phase === 1) {
      const T = S.titan, bot = T.segs.find(g => !g.dead && g.hp > 0);
      if (bot) {
        const x = snap(bot.x), y = snap(bot.y + RAD[bot.t] * 0.7);
        for (let k = 0; k < 8; k++) { const w = 64 - k * 7; pxRect(ctx, x - w / 2, y + k * 6, w, 6, k % 2 ? '#b07a36' : '#d9a35b'); }
      }
    }
    for (const d of S.drips || []) { pxRect(ctx, snap(d.x) - 4, snap(d.y) - 6, 8, 10, '#fff3d6'); pxRect(ctx, snap(d.x) - 2, snap(d.y) + 4, 4, 4, '#efd9a8'); }
    if (S.cherry && S.cherry.state !== 'bounce' && frameNo % 8 < 5) {
      // 落下地点の予告（真上で止まると色が変わって場所が確定する）
      const C = S.cherry, w = RAD[5] * 2, x = snap(C.tx - w / 2), locked = C.state === 'hang' || C.state === 'dive';
      pxRect(ctx, x, GROUND - 8, w, 8, locked ? '#ffe169' : '#f24d6b');
      for (let i = 0; i < 3; i++) pxRect(ctx, snap(C.tx) - 6 + i * 0, GROUND - 28 - i * 10, 12, 6, locked ? '#ffe169' : '#f24d6b');
    }
    if (S.grape && S.grape.core.attached) {
      // 本体と実をつなぐつる
      const c = S.grape.core;
      for (const gr of S.grape.grapes) {
        if (gr.dead) continue;
        for (let k = 2; k < 6; k++) pxRect(ctx, snap(c.x + (gr.x - c.x) * k / 6) - 2, snap(c.y + (gr.y - c.y) * k / 6) - 2, 4, 4, '#3f9b5a');
      }
    }
    for (const b of S.bubbles) drawBubble(b);
    if (S.power.beam && mode === 'play') {
      const top = Math.round(S.beamTop), len = GROUND - 44 - top, x = snap(S.px), wob = S.power.beam % 4 < 2 ? 2 : 0;
      ctx.globalAlpha = 0.55; pxRect(ctx, x - 10 - wob, top, 20 + wob * 2, len, '#ff8c42');
      ctx.globalAlpha = 1; pxRect(ctx, x - 6, top, 12, len, '#ffe169'); pxRect(ctx, x - 2, top, 4, len, '#ffffff');
      pxRect(ctx, x - 12, top - 4, 24, 8, '#fff6df');
    }
    for (const sd of S.seeds || []) {
      const x = snap(sd.x), y = snap(sd.y);
      if (sd.col) { pxRect(ctx, x - 4, y - 6, 8, 12, '#07120a'); pxRect(ctx, x - 2, y - 4, 4, 8, sd.col); continue; }
      pxRect(ctx, x - 5, y - 6, 10, 12, '#f7efc1'); pxRect(ctx, x - 3, y - 4, 6, 8, '#3a2112'); pxRect(ctx, x - 1, y - 3, 2, 2, '#c9a07a');
    }
    for (const bl of S.bullets) {
      ctx.fillStyle = bl.fever ? '#ffe169' : '#fff6df';
      const bc = bl.fever ? '#ffe169' : '#fff6df', tx = bl.vx / 13 * 6, ty = bl.vy / 13 * 6;
      pxRect(ctx, snap(bl.x) - 2, snap(bl.y) - 3, 4, 6, bc); pxRect(ctx, snap(bl.x - tx) - 2, snap(bl.y - ty) - 3, 4, 6, bc);
    }
    for (const d of S.drops) {
      if (d.t > 300 && Math.floor(d.t / 6) % 2) continue;
      const it = ITEMS[d.type], bob = snap(Math.sin(d.t * 0.15) * 2);
      pxRect(ctx, snap(d.x) - 12, snap(d.y + bob) - 12, 24, 24, it.c);
      pxRect(ctx, snap(d.x) - 8, snap(d.y + bob) - 8, 16, 16, '#07120a');
      ctx.fillStyle = '#fff6df'; ctx.font = '12px ' + FD; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(it.ch, snap(d.x), snap(d.y + bob) + 1);
    }
    if (mode !== 'title') drawPlayer();
    for (const p of S.parts) {
      const a = 1 - p.t / p.life;
      if (p.k === 'drop') { ctx.globalAlpha = a; pxRect(ctx, snap(p.x), snap(p.y), Math.max(2, p.r * a + 1), Math.max(2, p.r * a + 1), p.col); }
      else if (p.k === 'star') {
        ctx.globalAlpha = a; const x = snap(p.x), y = snap(p.y), c = p.t % 6 < 3 ? '#ffe169' : '#ffffff';
        pxRect(ctx, x - 2, y - 6, 4, 12, c); pxRect(ctx, x - 6, y - 2, 12, 4, c);
      }
      else if (p.k === 'spark') {
        ctx.globalAlpha = a; const s = Math.max(2, Math.round(p.r * a));
        pxRect(ctx, snap(p.x) - s, snap(p.y), s * 2, 2, '#ffffff');
        pxRect(ctx, snap(p.x), snap(p.y) - s, 2, s * 2, '#ffffff');
      }
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const t of S.texts) {
      ctx.globalAlpha = Math.min(1, (50 - t.t) / 20);
      const s = t.t < 6 ? 0.6 + t.t * 0.1 : 1;
      ctx.font = Math.round(t.size * s) + 'px ' + FD; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(6,48,31,.6)';
      ctx.strokeText(t.text, t.x, t.y - t.t * 0.9); ctx.fillStyle = t.col; ctx.fillText(t.text, t.x, t.y - t.t * 0.9);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (mode !== 'title') drawHud();
    const b = S.banner;
    if (b && mode !== 'title') {
      const p = b.t / b.dur;
      ctx.save(); ctx.globalAlpha = Math.min(1, (b.dur - b.t) / 15);
      ctx.translate(Math.round(W / 2), Math.round(H * 0.4) - Math.max(0, 8 - b.t) * 6);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '46px ' + FD;
      ctx.lineWidth = 9; ctx.strokeStyle = 'rgba(6,48,31,.75)'; ctx.strokeText(b.text, 0, 0);
      ctx.fillStyle = b.col; ctx.fillText(b.text, 0, 0);
      if (b.sub) { ctx.font = '800 16px ' + FB; ctx.lineWidth = 5; ctx.strokeText(b.sub, 0, 36); ctx.fillStyle = '#fff6df'; ctx.fillText(b.sub, 0, 36); }
      ctx.restore();
      void p;
    }
    if (S.freezeT && mode === 'play') { ctx.fillStyle = 'rgba(150,225,255,.13)'; ctx.fillRect(0, 0, W, H); }
    if (S.flash > 0.02) { ctx.fillStyle = `rgba(${S.flashCol},${S.flash})`; ctx.fillRect(0, 0, W, H); }
  }

  // ---- 画面サイズ ----
  function resize() {
    const r = wrap.getBoundingClientRect();
    let cw = r.width, ch = r.height;
    if (cw / ch > 0.62) cw = ch * 0.62;
    // 1論理ピクセル = 実画面のN×Nピクセル（Nは整数）なので、ドットの大きさが必ずそろう
    const ratio = window.devicePixelRatio || 1;
    const devW = Math.floor(cw * ratio), devH = Math.floor(ch * ratio);
    const N = Math.max(1, Math.round(devW / 400));
    W = Math.floor(devW / N);
    H = Math.max(560, Math.floor(devH / N));
    GROUND = H - 56;
    scale = N / ratio; dpr = 1;
    cv.width = W; cv.height = H;
    stage.style.width = (W * scale) + 'px';
    cv.style.width = (W * scale) + 'px'; cv.style.height = (H * scale) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(100, now - last) / (1000 / 60); last = now;
    while (acc >= 1) { if (mode !== 'pick' && mode !== 'pause') update(); acc -= 1; }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
